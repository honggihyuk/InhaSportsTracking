# Soccer 3D Digital Twin Configuration

# Project settings
project:
  name: "Soccer 3D Digital Twin"
  version: "1.0.0"
  description: "축구 경기 3D 디지털 트윈 및 분석 플랫폼"

# Detection settings - YOLO Model Configuration
detection:
  # Primary model: YOLO11s (COCO pretrained)
  # Downloaded from Ultralytics official repository
  # Location: models/yolo11s.pt (18.4MB)
  model_path: "models/yolo11s.pt"
  
  # Roboflow 전문 모델 사용 여부 (false 이면 기본 YOLO11 사용)
  use_roboflow_models: false
  
  # Roboflow 모델 경로 (use_roboflow_models: true 일 때만 사용)
  roboflow_models:
    players: "data/roboflow_datasets/football-players-detection/weights/best.pt"
    ball: "data/roboflow_datasets/football-ball-detection/weights/best.pt"
    field: "data/roboflow_datasets/football-field-detection/weights/best.pt"
  
  # Alternative models available:
  # - models/yolo11n.pt (5.4MB) - Faster, lower accuracy
  # - models/yolo11m.pt - Slower, higher accuracy (needs download)
  
  confidence_threshold: 0.25
  iou_threshold: 0.45
  img_size: 640
  device: "cpu"  # or "cuda" if GPU available
  
  # COCO classes relevant for soccer
  # Class 0: person (players, referee, goalkeeper)
  # Class 32: sports ball (soccer ball)
  classes: [0, 32]
  class_names:
    0: "person"
    32: "sports ball"

# Tracking settings
tracking:
  type: "bytetrack"  # or "botsort"
  track_threshold: 0.3
  match_threshold: 0.8
  max_age: 30  # frames
  min_hits: 3

# Camera calibration
calibration:
  field_length: 105.0  # meters (FIFA standard)
  field_width: 68.0    # meters
  camera_height: 15.0  # meters (estimated)
  auto_calibrate: true

# 3D Gaussian Splatting
gaussian_splatting:
  enabled: true
  canonical_space:
    num_gaussians: 10000
    sh_degree: 3
  deformation_mlp:
    hidden_dim: 256
    num_layers: 4
    time_encoding: true
  rendering:
    resolution: [1920, 1080]
    fps: 30

# Data processing
data:
  input_format: "mp4"  # or "rtsp", "image_sequence"
  output_format: "json"
  save_trajectories: true
  save_heatmaps: true

# Database (optional)
database:
  enabled: false
  type: "sqlite"  # or "postgresql"
  path: "data/sports_analysis.db"

# Visualization
visualization:
  show_detections: true
  show_trajectories: true
  show_field_overlay: true
  top_down_view: true
  web_interface: true
  port: 8080

# Logging
logging:
  level: "INFO"
  save_to_file: true
  log_dir: "logs"
