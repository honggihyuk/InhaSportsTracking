# Soccer 3D Digital Twin Configuration

# Project settings
project:
  name: "Soccer 3D Digital Twin"
  version: "1.0.0"
  description: "축구 경기 3D 디지털 트윈 및 분석 플랫폼"

# Detection settings - YOLO Model Configuration
detection:
  # Primary model: YOLO11s (COCO pretrained)
  # Downloaded from Ultralytics official repository
  # Location: models/yolo11s.pt (18.4MB)
  # YOLO 백엔드일 때 사용. CPU 기본값은 yolo11n (선수 탐지율은 비슷하고 약 3 배 빠름). GPU 에서는 yolo11s 권장
  model_path: "models/yolo11n.pt"
  
  # 탐지 백엔드: yolo | rfdetr | auto (auto: GPU 가 있고 rfdetr 가 설치되어 있으면 RF-DETR, 아니면 YOLO)
  backend: auto
  rfdetr:
    size: medium               # nano | small | medium | base | large (Apache 2.0)
    checkpoint: models/rfdetr_football/checkpoint_best_total.pth  # 파인튜닝 가중치 (scripts/train_rfdetr.py, 저장소에 없음 → 없으면 COCO 사전학습으로 대체)
    resolution: 960            # 파인튜닝 해상도 (checkpoint 가 없으면 무시해도 됨)
    confidence_threshold: 0.4  # 선수
    ball_threshold: 0.25       # 공 (작아서 점수가 낮게 나옴)

  # Roboflow 전문 모델 사용 여부 (false 이면 기본 YOLO11 사용)
  use_roboflow_models: false
  
  # Roboflow 모델 경로 (use_roboflow_models: true 일 때만 사용)
  roboflow_models:
    players: "data/roboflow_datasets/football-players-detection-3zvbc/weights/best.pt"
    ball: "data/roboflow_datasets/football-ball-detection-rejhg/weights/best.pt"
    field: "data/roboflow_datasets/football-field-detection-f07vi/weights/best.pt"
  
  # Alternative models available:
  # - models/yolo11n.pt (5.4MB) - Faster, lower accuracy
  # - models/yolo11m.pt - Slower, higher accuracy (needs download)
  
  confidence_threshold: 0.25
  iou_threshold: 0.45
  img_size: 640
  device: auto  # auto: GPU(CUDA) 가 있으면 cuda, 없으면 cpu. 직접 "cuda" / "cpu" 지정 가능
  
  # COCO classes relevant for soccer
  # Class 0: person (players, referee, goalkeeper)
  # Class 32: sports ball (soccer ball)
  classes: [0, 32]
  class_names:
    0: "person"
    32: "sports ball"

# 업로드 영상 분석 (backend /analysis)
#   realtime: 빠른 미리보기 (탐지 간격 3, 후처리 없음)
#   precise : 고정밀 오프라인 분석 — 매 프레임 탐지, 공 타일 추론, 트랙 잇기·보간, 경기장 라인 정렬 보정,
#             좌표 칼만+RTS 평활화, 골키퍼 판정, 경기 지표. CPU 에서는 느리지만(수 초/프레임) 백그라운드 작업
analysis:
  mode: precise      # 기본 분석 모드 (API 의 ?mode= 로 영상별 선택 가능)
  stride: 3          # 프로필에 값이 없을 때 쓰는 기본값
  ball_imgsz: 960
  profiles:
    realtime:
      stride: 3          # N 프레임마다 탐지, 사이 프레임은 박스 보간
      img_size: 640      # 선수 모델 추론 해상도
      ball_imgsz: 960    # 공 모델 추론 해상도 (중계 화면의 공은 수 픽셀이라 높게)
      ball_tile: null    # 공 타일 추론 끔
      postprocess: false
      line_refine: false
      auto_calibrate: false
    precise:
      stride: 1          # 매 프레임 탐지 (보간 없음)
      img_size: 960      # 멀리 있는 작은 선수까지
      ball_imgsz: 1280
      ball_tile: 640     # 원본 해상도 640 px 타일로 공 추가 탐지 (SAHI 방식)
      postprocess: true  # 트랙 잇기 · 공백 보간 · 공 오탐 제거
      line_refine: true  # 경기장 라인 마스크 저장 → 보정 시 매 프레임 라인 정렬 (누적 오차 제거)
      auto_calibrate: true  # 분석 직후 경기장 라인·센터서클로 자동 보정 (실패하면 수동 보정 안내)
      team_classifier: auto # siglip | color | auto (auto: GPU 면 SigLIP2 임베딩, 아니면 유니폼 평균색)
      sam_refine: auto      # true | false | auto (auto: GPU 면 SAM 마스크로 발 위치 정밀화)

# GPU 정밀 모델 (Hugging Face). 처음 쓸 때 자동 다운로드
gpu_models:
  siglip: google/siglip2-base-patch16-224
  sam: facebook/sam3                 # Hugging Face 접근 승인 + hf auth login 필요
  sam_fallback: facebook/sam2.1-hiera-large  # SAM3 를 받을 수 없으면 자동으로 사용 (승인 불필요)

# 경기 질의 에이전트 (POST /analysis/{name}/ask)
agent:
  provider: local                    # local: transformers 로 Qwen3-VL 직접 실행 | openai: OpenAI 호환 서버
  model: Qwen/Qwen3-VL-4B-Instruct   # GPU 8~12 GB 는 4B, 24 GB 이상은 8B, CPU 는 2B
  base_url: http://localhost:8001/v1 # provider: openai 일 때 (vLLM·Ollama·유료 API)
  api_key_env: OPENAI_API_KEY        # provider: openai 일 때 API 키를 읽을 환경 변수
  max_steps: 6                       # 도구 호출 반복 상한
  max_new_tokens: 768

# Tracking settings
tracking:
  type: "botsort"  # botsort(카메라 움직임 보정, 중계 영상 권장) | bytetrack | simple
  track_threshold: 0.3
  match_threshold: 0.8
  max_age: 30  # frames
  min_hits: 3

# Camera calibration
calibration:
  field_length: 105.0  # meters (FIFA standard)
  field_width: 68.0    # meters
  camera_height: 15.0  # meters (estimated)
  auto_calibrate: true

# 3D Gaussian Splatting
gaussian_splatting:
  enabled: true
  canonical_space:
    num_gaussians: 10000
    sh_degree: 3
  deformation_mlp:
    hidden_dim: 256
    num_layers: 4
    time_encoding: true
  rendering:
    resolution: [1920, 1080]
    fps: 30

# Data processing
data:
  input_format: "mp4"  # or "rtsp", "image_sequence"
  output_format: "json"
  save_trajectories: true
  save_heatmaps: true

# Database (optional)
database:
  enabled: false
  type: "sqlite"  # or "postgresql"
  path: "data/sports_analysis.db"

# Visualization
visualization:
  show_detections: true
  show_trajectories: true
  show_field_overlay: true
  top_down_view: true
  web_interface: true
  port: 8080

# Logging
logging:
  level: "INFO"
  save_to_file: true
  log_dir: "logs"
