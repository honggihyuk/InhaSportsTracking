# Soccer 3D Digital Twin Configuration

# Project settings
project:
  name: "Soccer 3D Digital Twin"
  version: "1.0.0"
  description: "축구 경기 3D 디지털 트윈 및 분석 플랫폼"

# Detection settings - YOLO Model Configuration
detection:
  # Primary model: YOLO11s (COCO pretrained)
  # Downloaded from Ultralytics official repository
  # Location: models/yolo11s.pt (18.4MB)
  # CPU 기본값은 yolo11n (선수 탐지율은 비슷하고 약 3 배 빠름). GPU 에서는 yolo11s 권장
  model_path: "models/yolo11n.pt"
  
  # Roboflow 전문 모델 사용 여부 (false 이면 기본 YOLO11 사용)
  use_roboflow_models: false
  
  # Roboflow 모델 경로 (use_roboflow_models: true 일 때만 사용)
  roboflow_models:
    players: "data/roboflow_datasets/football-players-detection-3zvbc/weights/best.pt"
    ball: "data/roboflow_datasets/football-ball-detection-rejhg/weights/best.pt"
    field: "data/roboflow_datasets/football-field-detection-f07vi/weights/best.pt"
  
  # Alternative models available:
  # - models/yolo11n.pt (5.4MB) - Faster, lower accuracy
  # - models/yolo11m.pt - Slower, higher accuracy (needs download)
  
  confidence_threshold: 0.25
  iou_threshold: 0.45
  img_size: 640
  device: "cpu"  # GPU 가 없을 경우 "cpu" 사용 (CUDA 없음 오류 방지)
  
  # COCO classes relevant for soccer
  # Class 0: person (players, referee, goalkeeper)
  # Class 32: sports ball (soccer ball)
  classes: [0, 32]
  class_names:
    0: "person"
    32: "sports ball"

# 업로드 영상 분석 (backend /analysis)
#   realtime: 빠른 미리보기 (탐지 간격 3, 후처리 없음)
#   precise : 고정밀 오프라인 분석 — 매 프레임 탐지, 공 타일 추론, 트랙 잇기·보간, 경기장 라인 정렬 보정,
#             좌표 칼만+RTS 평활화, 골키퍼 판정, 경기 지표. CPU 에서는 느리지만(수 초/프레임) 백그라운드 작업
analysis:
  mode: precise      # 기본 분석 모드 (API 의 ?mode= 로 영상별 선택 가능)
  stride: 3          # 프로필에 값이 없을 때 쓰는 기본값
  ball_imgsz: 960
  profiles:
    realtime:
      stride: 3          # N 프레임마다 탐지, 사이 프레임은 박스 보간
      img_size: 640      # 선수 모델 추론 해상도
      ball_imgsz: 960    # 공 모델 추론 해상도 (중계 화면의 공은 수 픽셀이라 높게)
      ball_tile: null    # 공 타일 추론 끔
      postprocess: false
      line_refine: false
      auto_calibrate: false
    precise:
      stride: 1          # 매 프레임 탐지 (보간 없음)
      img_size: 960      # 멀리 있는 작은 선수까지
      ball_imgsz: 1280
      ball_tile: 640     # 원본 해상도 640 px 타일로 공 추가 탐지 (SAHI 방식)
      postprocess: true  # 트랙 잇기 · 공백 보간 · 공 오탐 제거
      line_refine: true  # 경기장 라인 마스크 저장 → 보정 시 매 프레임 라인 정렬 (누적 오차 제거)
      auto_calibrate: true  # 분석 직후 경기장 라인·센터서클로 자동 보정 (실패하면 수동 보정 안내)

# Tracking settings
tracking:
  type: "botsort"  # botsort(카메라 움직임 보정, 중계 영상 권장) | bytetrack | simple
  track_threshold: 0.3
  match_threshold: 0.8
  max_age: 30  # frames
  min_hits: 3

# Camera calibration
calibration:
  field_length: 105.0  # meters (FIFA standard)
  field_width: 68.0    # meters
  camera_height: 15.0  # meters (estimated)
  auto_calibrate: true

# 3D Gaussian Splatting
gaussian_splatting:
  enabled: true
  canonical_space:
    num_gaussians: 10000
    sh_degree: 3
  deformation_mlp:
    hidden_dim: 256
    num_layers: 4
    time_encoding: true
  rendering:
    resolution: [1920, 1080]
    fps: 30

# Data processing
data:
  input_format: "mp4"  # or "rtsp", "image_sequence"
  output_format: "json"
  save_trajectories: true
  save_heatmaps: true

# Database (optional)
database:
  enabled: false
  type: "sqlite"  # or "postgresql"
  path: "data/sports_analysis.db"

# Visualization
visualization:
  show_detections: true
  show_trajectories: true
  show_field_overlay: true
  top_down_view: true
  web_interface: true
  port: 8080

# Logging
logging:
  level: "INFO"
  save_to_file: true
  log_dir: "logs"
